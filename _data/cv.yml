        highlights:
          - "Led the computer vision and machine learning components of an AIoT pet robot integrating on-device perception, motion control, cloud analysis, and dashboarding."
          - "Built real-time dog detection and motion control on Raspberry Pi 5 using YOLO, FastAPI, sensor fusion, and target tracking."
          - "Developed cloud pipelines for automated image capture, behavior summarization, and a VGG16-based pet emotion classifier exposed through reusable APIs."

