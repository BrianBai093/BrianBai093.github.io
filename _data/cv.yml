    Selected Projects:
      - name: Agentic Java Formal Verification
        start_date: 2025-09
        end_date: 2025-12
        summary: Columbia University, Formal Verification of Hardware and Software Systems Project
        highlights:
          - "Developed a multi-agent prototype that connects LLM-based code understanding with Java / Spring Boot formal verification, translating source-code slices into candidate safety properties and JBMC-ready harnesses."
          - "Designed a three-stage pipeline with a code explorer agent, property formalizer agent, and harness generator agent, producing structured artifacts for parsed code slices, inferred properties, generated harnesses, and execution logs."
          - "Tested the prototype on application-level properties including RBAC constraints, inventory-update consistency, and status-transition safety."

      - name: ConvNeXt and ViT for Hierarchical Open-Set Image Classification
        start_date: 2025-09
        end_date: 2025-12
        summary: Columbia University, Neural Networks and Deep Learning Project
        highlights:
          - "Built a two-stage hierarchical open-set recognition pipeline in PyTorch for super-class and sub-class prediction."
          - "Implemented a unified classifier framework with interchangeable ImageNet-pretrained ConvNeXt and ViT backbones for controlled comparison."
          - "Developed reproducible training utilities, including flexible data loading, automatic validation split, checkpointing, and metric logging."
          - "Evaluated the approach on a 6,288-image dataset with 3 super-classes and 87 sub-classes."
          - "On a held-out novel split, improved unseen sub-class recognition from 62.24% to 82.22% using ConvNeXt; compared Softmax-thresholding (91.60%) with OpenMax (59.60%) for novelty rejection."

      - name: "TrueShot: P2P Blockchain Prototype for Photo Provenance Verification"
        start_date: 2026-02
        end_date: 2026-05
        summary: Columbia University, Computer Networks Course Project
        highlights:
          - "Built a peer-to-peer photo provenance prototype with tracker-based peer discovery, gossip-based transaction and block propagation, a proof-of-work blockchain, Merkle-root validation, ECDSA-signed device records, and a Flask verification UI."
          - "Implemented security demos including forged longest-chain replacement, tracker poisoning, gossip sender URL spoofing, mempool flooding, and image tampering detection; the project report documents 69 passing tests across blockchain, network, application, and web layers."

      - name: Computer Vision and ML Lead, Pet Companion Robot
        start_date: 2025-09
