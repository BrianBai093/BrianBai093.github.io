    Research Experience:
      - company: Zhejiang Lab
        position: Research Assistant
        location: Hangzhou, China
        start_date: 2026-06
        end_date: present
        summary: "Advisor: Jiaxi Yang, Research Scientist, Zhejiang Lab"
        highlights:
          - "Project: Feedback Learning for EHR SQL Repair: SFT vs. GRPO; manuscript in preparation."
          - "Conducted a pre-registered study comparing SFT and GRPO on how diagnostic feedback shapes learning for EHR SQL repair, fine-tuning Qwen3.5-9B on MIMIC-IV EHR questions under four nested feedback levels, from a bare failure signal to repair hints."
          - "Trained 12 QLoRA adapters (4 feedback conditions x 3 seeds, 1,200 samples) and evaluated semantic repair success across 13 model groups and 10,400 records, using paired comparisons with task-clustered confidence intervals, permutation tests, and Holm correction."
          - "Found no stable incremental benefit from richer feedback under SFT: matched gains of +1.0 to +2.0 percentage points did not meet the pre-registered significance bar, a carefully bounded null result."
          - "Built a target-free GRPO pipeline with a custom binary execution reward and observed a non-monotonic feedback effect, with the intermediate L2 level reaching +10.0 points (95% CI [+4.0, +16.5], exploratory Holm-adjusted p = 0.0228), pending multi-seed confirmation."
          - "Ran all 12 adapters on a single 24 GB GPU under a strict no-leakage protocol, with reward verification isolated in a read-only database worker that never returns gold answers or verifier diagnostics to the model."

      - company: Columbia University, CRIS Lab
        position: Research Assistant
        location: New York, NY
        start_date: 2025-09
        end_date: 2026-05
        summary: "Advisor: Prof. Venkat Venkatasubramanian"
        highlights:
          - "Project: DeepAudit: Agentic Evidence-Based Auditing of ML Reproducibility; manuscript in preparation."
          - "Designed and implemented DeepAudit, an agentic claim-level reproducibility auditing system that maps ML paper claims to executable repository tasks, metric contracts, runtime artifacts, and structured verdicts."
          - "Built a 23-step Python pipeline covering PDF-to-Markdown ingestion, table/figure-aware claim extraction, repository analysis, RAG-assisted code indexing, environment repair, autonomous execution, evidence alignment, scoring, and report generation."
          - "Formulated ML reproducibility auditing as claim-level evidence alignment rather than binary repository execution, distinguishing metric disagreement from missing data, incompatible environments, ambiguous entry points, unlogged metrics, and compute limits."
          - "Evaluated DeepAudit on 10 public ML paper-code pairs with 64 pre-specified audit targets; extracted 1,101 claims, identified 988 code-verifiable claims (89.7%), generated 49 metric contracts, and executed 52/64 experiment specifications (81.2%)."
          - "Recovered executable or diagnostic evidence for all five initially broken repositories through bounded environment repair, autonomous execution, conservative verification, and structured failure analysis."

      - company: Columbia University / IBM Research Collaboration
        position: Research Assistant
        location: New York, NY
        start_date: 2026-02
        end_date: 2026-07
        summary: "Mentored by Dhaval Patel, Senior Technical Staff Member, IBM Research"
        highlights:
          - "Project: Multi-Turn AssetOps: Supervisor-Specialist Agents for Industrial O&M."
          - "Proposed and designed a LangGraph-based Supervisor-Specialist multi-agent architecture for multi-turn industrial asset operations, routing user goals across data collection, time-series analysis, failure reasoning, and maintenance-planning specialists over MCP tools."
          - "Designed structured cross-turn artifact reuse to preserve sensor datasets, anomaly analyses, failure hypotheses, and maintenance recommendations as reusable evidence across follow-up turns."
          - "Iteratively optimized routing, artifact reuse, and MCP tool execution with domain-specific tool constraints, schema validation, duplicate-call suppression, and failure guards."
          - "Co-developed and evaluated the system on 16 multi-turn industrial O&M dialogs covering fault diagnosis, predictive maintenance, operational monitoring, maintenance planning, and full-pipeline remediation workflows."
          - "Reported improvements over a Plan-Execute baseline: +54.5% planning effectiveness, +37.8% task completion, tool-time share reduced from 47.3% to 26.3%, and follow-up turns approximately 4.2x faster after artifact reuse."
          - "Analyzed system-level trade-offs between specialist routing and parallel tool execution, showing that naive parallelism can reduce API calls while increasing token/context cost and tail latency."

