        highlights:
          - "Developed DeepAudit, an LLM-agent framework that autonomously verifies whether quantitative claims in ML papers are reproducible from their companion code, replacing labor-intensive manual auditing with a hands-off automated pipeline."
          - "Proposed a six-level failure taxonomy covering dependency, data, configuration, code, resource, and output failures for automated diagnosis, targeted repair, and interpretable reproducibility verdicts."
          - "Engineered an end-to-end pipeline spanning claim extraction, environment provisioning, autonomous code execution with LLM-driven replanning, and tolerance-aware verdict generation."
          - "Evaluated on 20 peer-reviewed ML papers, achieving 80% end-to-end reproduction success with fully traceable execution evidence."

      - company: Columbia University / IBM Research Collaboration
        position: Research Assistant
        location: New York, NY
        start_date: Feb 2026
        end_date: Present
        summary: "Mentored by Dhaval Patel, Senior Technical Staff Member, IBM Research"
        highlights:
          - "Proposed a Supervisor-Specialist multi-agent architecture with intent routing, layered validation, and dynamic replanning to address the brittleness of linear plan-then-execute pipelines under multi-turn interaction and partial failures."
          - "Implemented and optimized the architecture in LangGraph on IBM's AssetOpsBench, with specialists for data collection, time-series analysis, failure reasoning, and maintenance planning."
          - "Designed a world-model-inspired memory module that maintains asset state, diagnostic hypotheses, and action history across turns, improving dialog consistency and reducing redundant tool calls."
          - "Co-developed a benchmark of 16 multi-turn industrial dialog scenarios spanning fault diagnosis, predictive maintenance, and lifecycle management."
          - "Evaluated end-to-end task success and failure-recovery behavior, with ablations isolating the contribution of the memory module and supervisor-level replanner."

