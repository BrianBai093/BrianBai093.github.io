    Projects:
      - name: ConvNeXt and ViT for Hierarchical Open-Set Image Classification
        summary: "Columbia University, Neural Networks and Deep Learning Project"
        highlights:
          - "Built a two-stage hierarchical open-set recognition pipeline in PyTorch for super-class and sub-class prediction."
          - "Implemented a unified classifier framework with interchangeable ImageNet-pretrained ConvNeXt and ViT backbones for controlled comparison."
          - "Developed reproducible training utilities, including flexible data loading, automatic validation split, checkpointing, and metric logging."
          - "Evaluated on a 6,288-image dataset with 3 super-classes and 87 sub-classes."
          - "On a held-out novel split, improved unseen sub-class recognition from 62.24% to 82.22% using ConvNeXt; compared Softmax-thresholding (91.60%) with OpenMax (59.60%) for novelty rejection."

      - name: Computer Vision and ML Lead, Pet Companion Robot
